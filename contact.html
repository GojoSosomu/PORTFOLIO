    <fieldset>
        <legend align="center">
            <font face="Arial" size="5">
                <b>
                    |CONTACT|
                </b>
            </font>
        </legend>
        <h1 align="center">
            <font face="Arial">
                This is my contact form
            </font>
        </h1>
    </fieldset>
    <br><br>

<body bgcolor="#f6f0f0">
    <form action="/submit-message" method="post">
        <fieldset>
            <legend align="center">
                <font face="Arial" size="4">
                    <b>
                        |FORM|
                    </b>
                </font>
            </legend>
            <fieldset>
                <legend>
                    <font face="Arial" size="3">
                        <b>
                            |CONTACT|
                        </b>
                    </font>
                </legend>
                <label for="message" align="center">
                    <font face="Arial" size="2">
                        <strong>Full Name:</strong>
                    </font>
                </label>
                <input type="text" placeholder="Last Name, First Name, Middle Name">
                <br>
                <label for="message" align="center">
                    <font face="Arial" size="2">
                        <strong>Email Account:</strong>
                    </font>
                </label>
                <input type="email" placeholder="username@gmail.com">
                <br>
                <label for="message" align="center">
                    <font face="Arial" size="2">
                        <strong>Password:</strong>
                    </font>
                </label>
                <input type="text">
                <br>
                <label>Gender:</label>
                <label>Male</label>
                <input type="radio" name="gender" value="male">
                <label>Female</label>
                <input type="radio" name="gender" value="female">
                <label>Other</label>
                <input type="radio" name="gender" value="other">
                <br>
                <label>Interest:</label>
                <label>Programming</label>
                <input type="checkbox" value="programming">
                <label>Illustrating</label>
                <input type="checkbox" value="illustrating">
                <label>Painting</label>
                <input type="checkbox" value="painting">
                <label>Sports</label>
                <input type="checkbox" value="sports">
                <br>
                <label>Strand:</label>
                <select>
                    <option value="acad">ACAD</option>
                    <option value="techpro">TECHPRO</option>
                </select>
                <br>
            </fieldset>
            <br><br>
            <fieldset>
                <legend>
                    <font face="Arial" size="4">
                        <b>
                            |SUBMISSION ACTION BUTTON|
                        </b>
                    </font>
                </legend>
                <center>
                    <input type="submit" value="Submit">
                    </input>
                    <input type="reset" value="Clear">
                    </input>
                </center>
            </fieldset>
        </fieldset>
        <br><br>
    </form>
</body>
